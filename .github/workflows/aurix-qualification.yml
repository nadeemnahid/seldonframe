name: Aurix ingress qualification
on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/crm/src/lib/aurix/**'
      - 'packages/crm/src/app/api/integrations/aurix/**'
      - 'packages/crm/src/app/api/webhooks/twilio/sms/route.ts'
      - 'packages/crm/drizzle/**'
      - 'packages/crm/src/lib/workflow/**'
      - 'packages/crm/src/lib/agents/**'
      - 'packages/crm/tests/integration/aurix*'
      - 'packages/crm/tests/unit/aurix*'
      - 'packages/crm/tests/unit/aurix-ingress.spec.ts'
      - '.github/workflows/aurix-qualification.yml'
permissions:
  contents: read
jobs:
  ingress:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.18.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:check-journaled
      - run: pnpm typecheck
      - run: cd packages/crm && node --import tsx --test tests/unit/aurix-*.spec.ts
      - name: Install isolated PostgreSQL test runtime
        run: npm install --prefix /tmp/aurix-test-db --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.3.14
      - name: Validate integration migrations, transactions and rollback
        run: cd packages/crm && AURIX_TEST_DB_ROOT=/tmp/aurix-test-db node --import tsx --test tests/integration/aurix-database.spec.mjs
      - run: pnpm build
